spring:
  datasource:
    url: jdbc:h2:mem:hedera_agents;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: none
  flyway:
    enabled: true
    clean-disabled: false
  test:
    database:
      replace: none
