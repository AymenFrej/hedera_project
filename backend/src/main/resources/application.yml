server:
  port: ${BACKEND_PORT:8080}

spring:
  application:
    name: hedera-agent-platform
  datasource:
    url: jdbc:postgresql://${DATABASE_HOST:localhost}:${DATABASE_PORT:5432}/${DATABASE_NAME:hedera_agents}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

hedera:
  network: ${HEDERA_NETWORK:testnet}
  operator-id: ${HEDERA_OPERATOR_ID:}
  operator-private-key: ${HEDERA_OPERATOR_PRIVATE_KEY:}
  # ECDSA or ED25519, matching the account created on the Hedera portal.
  key-type: ${HEDERA_KEY_TYPE:ECDSA}
  # Leave blank to create a topic on first start; pin the id afterwards to reuse it.
  audit-topic-id: ${HEDERA_AUDIT_TOPIC_ID:}
  account-key-encryption-secret: ${HEDERA_ACCOUNT_KEY_ENCRYPTION_SECRET:}
  # Verification reads go through the Mirror Node REST API, never through the SDK.
  mirror-node-url: ${HEDERA_MIRROR_NODE_URL:https://testnet.mirrornode.hedera.com}

payments:
  ai:
    # Which model reads payment sentences: claude, gemini or ollama. Blank = Claude if its key is
    # set, otherwise off (the manual request form always works).
    provider: ${PAYMENT_AI_PROVIDER:}
    api-key: ${ANTHROPIC_API_KEY:}
    model: ${PAYMENT_AI_MODEL:claude-opus-5}
    gemini:
      api-key: ${GEMINI_API_KEY:}
      model: ${GEMINI_MODEL:gemini-flash-latest}
    ollama:
      url: ${OLLAMA_URL:http://localhost:11434}
      model: ${OLLAMA_MODEL:qwen2.5:3b}
  # Optional demo fixtures, created once with: ./mvnw test -Dtest=PaymentDemoSetup
  demo-token-id: ${PAYMENT_DEMO_TOKEN_ID:}
  demo-recipient-id: ${PAYMENT_DEMO_RECIPIENT_ID:}
